<!doctype html><html lang="en"><head><meta charset="utf-8"><title>NajmEditor — simulated workflow</title><style>
*{box-sizing:border-box}html,body{margin:0;background:#10151d;color:#f7f8fc;font-family:Arial,sans-serif;width:1280px;height:720px;overflow:hidden}body{padding:34px 48px;background:radial-gradient(ellipse at 85% 0,#232b3b 0,transparent 55%),#10151d}header{display:flex;justify-content:space-between;align-items:center;font-size:25px}.wordmark{font-weight:700;letter-spacing:-1px}.badge{border:1px solid #438978;color:#80efd2;border-radius:24px;padding:9px 18px;font-size:18px}.steps{display:flex;gap:10px;margin:24px 0 22px}.steps span{padding:10px 20px;border:1px solid #42495c;border-radius:9px;color:#a8b5c7;font-size:19px}.steps .active{color:#10151d;background:#b59ae8;border-color:#b59ae8}h1{font-size:46px;letter-spacing:-1.4px;line-height:1.1;margin:0 0 10px}p.subtitle{font-size:23px;color:#bac6d5;margin:0 0 22px}.scene{height:392px}.panel{border:1px solid #3c4558;border-radius:18px;background:linear-gradient(135deg,#202734,#151b24);padding:24px}.split{display:grid;grid-template-columns:1fr 1fr;gap:22px}.panel h2{font-size:28px;margin:0 0 16px}.mint{color:#80efd2}.lavender{color:#b59ae8}.tag{font-size:14px;padding:5px 8px;border-radius:6px;background:#394044;color:#80efd2;margin-left:12px}.rule{padding:16px 0;border-top:1px solid #3b4555;font-size:23px}.rule small{display:block;color:#b9c3d1;font-size:17px;margin-top:9px}.timeline{position:relative;display:flex;height:58px;gap:3px;margin-top:12px;border-radius:8px;overflow:hidden;background:#10151d}.timeline i{display:block;height:100%;border:1px solid #a4a8eb99;border-radius:6px;background:#7c87cf}.timeline.tight i{background:#80efd2;border-color:#aaf8e6}.labels{display:flex;justify-content:space-between;color:#a8b5c7;font-size:16px;margin:8px 0 16px}.caption-track{height:25px;display:flex;gap:15px;margin:12px 20px}.caption-track b{background:#b59ae8;border-radius:5px;flex:1}.wave{height:38px;border-radius:6px;background:repeating-linear-gradient(90deg,#80efd2 0 3px,transparent 3px 7px);clip-path:polygon(0 45%,5% 20%,10% 55%,15% 5%,20% 40%,25% 25%,30% 58%,35% 10%,40% 36%,45% 20%,50% 40%,55% 15%,60% 50%,65% 25%,70% 48%,75% 8%,80% 37%,85% 18%,90% 42%,95% 30%,100% 47%,100% 60%,95% 75%,90% 58%,85% 80%,80% 63%,75% 92%,70% 52%,65% 75%,60% 50%,55% 85%,50% 60%,45% 80%,40% 64%,35% 90%,30% 42%,25% 75%,20% 60%,15% 95%,10% 45%,5% 80%,0 55%)}footer{position:absolute;bottom:28px;left:48px;right:48px;display:flex;justify-content:space-between;color:#a8b5c7;font-size:17px}.source-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:18px}.source{height:300px;text-align:center}.shape-box{height:200px;display:flex;align-items:center;justify-content:center;position:relative;overflow:hidden;border-radius:10px;background:#10151d}.shape{display:block;width:100px;height:100px;background:#b59ae8}.circle{border-radius:50%}.square{background:#80efd2;border-radius:8px}.triangle{background:#bac8dc;clip-path:polygon(50% 0,100% 100%,0 100%)}.review .shape-box{height:150px}.review{padding:18px 22px}.review h2{font-size:25px;margin-bottom:10px;display:flex;justify-content:space-between}.review .timeline{height:40px;margin-top:16px}.review .labels{margin-bottom:0}.review .caption{position:absolute;bottom:12px;font-size:20px;background:#1c2430;padding:7px 15px;border-radius:6px}.playhead{position:absolute;top:0;bottom:0;width:2px;background:white;z-index:2}.reference-note{margin-top:22px;font-size:22px;line-height:1.55}.pill{display:inline-block;border:1px solid #55516e;background:#272639;padding:8px 12px;border-radius:8px;color:#b59ae8;font-size:17px}.scene-number{font-size:18px;color:#80efd2;margin-bottom:18px}.comparison-note{font-size:18px;margin-top:16px;color:#bac6d5}
</style></head><body><header><div class="wordmark">NajmEditor</div><div class="badge">Simulated workflow · actual fixture plans</div></header><nav class="steps"><span>1 Learn Timeline</span><span>2 Save Editing Agent</span><span>3 Auto Edit</span><span>4 Review in Premiere</span></nav><h1 id="heading"></h1><p id="subtitle" class="subtitle"></p><main id="scene" class="scene"></main><footer><span>Original synthetic footage · local rules · fixture inference</span><span>Premiere verification pending</span></footer><script>
window.fixture=null;function bars(plan,tight,time){return '<div class="timeline '+(tight?'tight':'')+'">'+plan.shots.map(s=>'<i style="width:'+((s.timeline_end-s.timeline_start)/12*100)+'%"></i>').join('')+(time===undefined?'':'<b class="playhead" style="left:'+(time/12*100)+'%"></b>')+'</div><div class="labels"><span>00:00</span><span>00:04</span><span>00:08</span><span>00:12</span></div>'}
function shape(type,time){return '<span class="shape '+type+'" style="transform:translateX('+(Math.sin(time*1.1)*42)+'px) rotate('+(type==='triangle'?time*8:0)+'deg)"></span>'}
function clipFor(plan,t){return plan.shots.find(s=>t>=s.timeline_start&&t<s.timeline_end)||plan.shots[plan.shots.length-1]}
function review(data,t,tight){let shot=clipFor(data.plan,t),kind=shot.source_media.split('/').pop().split('.')[0],sourceTime=shot.source_in+t-shot.timeline_start,index=['circle','square','triangle'].indexOf(kind),words=['الدائرة الأولى','المربع الثاني','المثلث الثالث'];return '<article class="panel review"><h2><span class="'+(tight?'mint':'lavender')+'">'+data.summary.agent.name+'</span><span>'+data.summary.agent.rules[0].value/1000+' s · '+data.plan.shots.length+' shots</span></h2><div class="shape-box">'+shape(kind,sourceTime)+'<span class="caption" dir="rtl">'+words[index]+'</span></div>'+bars(data.plan,tight,t)+'<div class="comparison-note">Output '+t.toFixed(2)+' s · source '+sourceTime.toFixed(2)+' s<br>Same footage · different confirmed pacing</div></article>'}
window.renderFrame=function(time){const f=window.fixture;if(!f)return;const stage=time<4?0:time<8?1:time<12?2:3;document.querySelectorAll('.steps span').forEach((el,i)=>el.className=i===stage?'active':'');const headings=['A finished timeline becomes a starting point.','Save an agent for each client or series.','Bring the same fresh footage.','Two agents. Two reviewable first passes.'],sub=['Read-only reference → pacing and structure detected.','Two visible rules, with executable and advisory support labeled.','The new story and source clips stay authoritative.','Matching output timestamps show the actual validated plan difference.'];document.getElementById('heading').textContent=headings[stage];document.getElementById('subtitle').textContent=sub[stage];const scene=document.getElementById('scene');
 if(stage===0)scene.innerHTML='<div class="split"><article class="panel"><div class="scene-number">FINISHED REFERENCE · SYNTHETIC</div>'+bars(f.slow.plan,false)+'<div class="caption-track"><b></b><b></b><b></b></div><div class="wave"></div><p class="reference-note">Reference timing is measured locally.<br><span class="mint">The original timeline stays intact.</span></p></article><article class="panel"><h2 class="lavender">Detected evidence</h2><div class="rule">2,000 ms visual pace<span class="tag">DERIVED</span><small>Six primary clips across twelve seconds</small></div><div class="rule">Cuts, layers and source reuse<small>Structure is observed. Narrative intent is not inferred.</small></div><span class="pill">Fonts / exact effects: unavailable</span></article></div>';
 if(stage===1)scene.innerHTML='<div class="split">'+[f.slow,f.fast].map((d,i)=>'<article class="panel"><div class="scene-number">SAVED EDITING AGENT · v'+d.summary.agent.version+'</div><h2 class="'+(i?'mint':'lavender')+'">'+d.summary.agent.name+'</h2><div class="rule">Visual pace: '+d.summary.agent.rules[0].value/1000+' seconds<span class="tag">APPLIES</span><small>Confirmed rule enters the candidate planner</small></div><div class="rule">Opening pace: '+d.summary.agent.rules[1].value/1000+' seconds<span class="tag">ADVISORY</span><small>Saved context; not guaranteed timing</small></div><span class="pill">Saved locally · no private template included</span></article>').join('')+'</div>';
 if(stage===2)scene.innerHTML='<div class="source-grid">'+['circle','square','triangle'].map((type,i)=>'<article class="panel source"><div class="shape-box">'+shape(type,time-8)+'</div><h2>'+['Circle','Square','Triangle'][i]+'</h2><span class="mint">Original synthetic source '+(i+1)+'</span></article>').join('')+'</div><p class="comparison-note">Same source set for both agents · no client footage · no model credentials</p>';
 if(stage===3){const t=Math.min(11.99,(time-12)*1.5);scene.innerHTML='<div class="split">'+review(f.slow,t,false)+review(f.fast,t,true)+'</div>';}
};
</script></body></html>
